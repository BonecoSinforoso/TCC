# Treino do agente do Infinity (PPO). Formato do mlagents 1.1.0 / com.unity.ml-agents 4.2.0.
#
# Uso: ml\treinar.bat infinity Infinity01   (e depois Play na cena Scene_treinoInfinity)
# O nome "Infinity" precisa ser igual ao Behavior Name do Behavior Parameters do agente.

behaviors:
  Infinity:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3.0e6
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 200000
    keep_checkpoints: 5

engine_settings:
  time_scale: 20
