# Treino do agente do Pong (PPO). Formato do mlagents 1.1.0 / com.unity.ml-agents 4.2.0.
#
# Uso: ml\treinar.bat pong Pong01   (e depois Play na cena Scene_treinoPong)
# O nome "Pong" precisa ser igual ao Behavior Name do Behavior Parameters do agente.
# Rede pequena (2 x 64) de proposito: a inferencia na build WebGL roda em CPU.

behaviors:
  Pong:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1.5e6
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 200000
    keep_checkpoints: 5

engine_settings:
  time_scale: 20
